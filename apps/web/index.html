<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模序 · 前后端协作实验</title><link rel="stylesheet" href="styles.css"></head>
<body><main><p class="eyebrow">MOXU FULLSTACK EXPERIMENT · V0</p><h1>前端提出一件事，<br><em>后端给出结构化回应。</em></h1><p class="intro">这是一个真实可运行的前后端协作实验，不是流程展示。</p><section><label for="event">写下今天发生的一件小事</label><textarea id="event" placeholder="例如：今天开会时，我终于说出了自己的想法。"></textarea><button id="send">交给后端处理 →</button><p id="status"></p></section><article id="result" hidden><small>后端返回结果</small><h2 id="reply"></h2><div id="actions"></div><code id="version"></code></article></main><script src="app.js"></script></body></html>
